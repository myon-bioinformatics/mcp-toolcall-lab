name: Validate GitHub Actions

on:
  schedule:
    - cron: "29 21 * * *"  # 🔁 follow-main
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@main

  # 🔁 own sources follow main: on schedule / manual run, take main of own repositories and push to main
  follow-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-follow-main.yml@main
    permissions:
      contents: write
    with:
      node-version: "26"
      after: uv run --locked --extra test python scripts/build_terminal_css.py
      check: |
        uv run --locked --extra test pytest -q
