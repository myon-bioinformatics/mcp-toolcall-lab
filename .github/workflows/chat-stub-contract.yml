name: chat-stub-contract

on:
  pull_request:
    paths:
      - "deploy/chat-stub/**"
      - "fixtures/prompt_experiments/**"
      - "tests/test_chat_contract.py"
      - ".github/workflows/chat-stub-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Python contract
        run: uv run --locked --extra test python -m pytest -q tests/test_chat_contract.py
      - name: Deno type check
        run: deno check deploy/chat-stub/main.ts deploy/chat-stub/test_main.ts
      - name: Deno contract
        run: deno test --allow-read deploy/chat-stub/test_main.ts
