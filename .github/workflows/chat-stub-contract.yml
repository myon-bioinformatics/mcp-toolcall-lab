name: chat-stub-contract

on:
  pull_request:
    paths:
      - "deploy/chat-stub/**"
      - "fixtures/prompt_experiments/**"
      - "tests/test_chat_contract.py"
      - ".github/workflows/chat-stub-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.12.15"
          enable-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Python contract
        run: uv run --locked --extra test python -m pytest -q tests/test_chat_contract.py
      - name: Deno type check
        run: deno check deploy/chat-stub/main.ts deploy/chat-stub/test_main.ts
      - name: Deno contract
        run: deno test --allow-read deploy/chat-stub/test_main.ts
