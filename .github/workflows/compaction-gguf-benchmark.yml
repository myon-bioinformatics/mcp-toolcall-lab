name: compaction-gguf-benchmark

# Real inference and new measurements require an explicit manual dispatch.
# Ordinary CI retains the fixture/mock tests without starting a model.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gguf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout benchmark head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          activate-environment: true
          enable-cache: false

      - name: Checkout immutable Aoi research verdict catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/Aoi
          ref: 7084f4bd8463dc8b4732f020ff96c431c7172bf8
          path: .aoi-evidence
          sparse-checkout: |
            cycles/c001-chunichi/outputs/index.md
            cycles/c001-chunichi/propositions.toml
          persist-credentials: false

      - name: Offline unit tests and raw JUnit
        env:
          PYTHONPATH: src
        run: |
          mkdir -p test-results
          uv run --locked --extra test python -m pytest -q tests/test_compaction.py tests/test_compaction_gguf_benchmark.py tests/test_aoi_gguf_benchmark.py \
            --junitxml=test-results/compaction-gguf-pytest.xml

      - name: Download and verify pinned GGUF model
        run: |
          python scripts/fetch_tiny_cpu_gguf.py docker/stub-pages/models/model.gguf
          printf '%s  %s\n' \
            '2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d' \
            docker/stub-pages/models/model.gguf | sha256sum --check --status

      - name: Start digest-pinned llama.cpp server on loopback
        run: |
          docker run --detach --name compaction-gguf \
            --cpus=2 --memory=3g \
            -p 127.0.0.1:8080:8080 \
            -v "$PWD/docker/stub-pages/models:/models:ro" \
            ghcr.io/ggml-org/llama.cpp:server-b11669@sha256:8ffe0d28ff5261cc2f78ca1f67db1515bc2529b904a3c25f5b24f4cedfc3411d \
            -m /models/model.gguf --host 0.0.0.0 --port 8080 \
            --ctx-size 2048 --parallel 1 --threads 2
          ready=0
          for _ in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs --tail=80 compaction-gguf
            exit 1
          fi

      - name: Paired live GGUF evaluation
        env:
          PYTHONPATH: src
        run: |
          python -m mcp_toolcall_lab.compaction_gguf_benchmark \
            --base-url http://127.0.0.1:8080 \
            --out test-results/compaction-gguf-results.json \
            --model-file docker/stub-pages/models/model.gguf \
            --expected-sha256 2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d \
            --trials 2

      - name: Paired Aoi published propositions evaluation
        env:
          PYTHONPATH: src
        run: |
          python -m mcp_toolcall_lab.aoi_gguf_benchmark \
            --aoi-index .aoi-evidence/cycles/c001-chunichi/outputs/index.md \
            --aoi-propositions .aoi-evidence/cycles/c001-chunichi/propositions.toml \
            --base-url http://127.0.0.1:8080 \
            --out test-results/aoi-compaction-gguf-results.json \
            --model-file docker/stub-pages/models/model.gguf \
            --expected-model-sha256 2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d \
            --trials 2

      - name: Paired Aoi complete 114-proposition evaluation
        env:
          PYTHONPATH: src
        run: |
          python -m mcp_toolcall_lab.aoi_gguf_benchmark \
            --scope all --trials 1 \
            --aoi-index .aoi-evidence/cycles/c001-chunichi/outputs/index.md \
            --aoi-propositions .aoi-evidence/cycles/c001-chunichi/propositions.toml \
            --base-url http://127.0.0.1:8080 \
            --out test-results/aoi-full-compaction-gguf-results.json \
            --model-file docker/stub-pages/models/model.gguf \
            --expected-model-sha256 2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d

      - name: Validate report redaction and add numeric summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = Path("test-results/compaction-gguf-results.json").read_text(encoding="utf-8")
          forbidden = ("SYSTEM OVERRIDE:", "Archived Osaka lookup:",
                       "Previous Kyoto lookup", "What is 2 + 2?", "Previous observation of Kyoto")
          if any(item in data for item in forbidden):
              raise SystemExit("Raw fixture text unexpectedly present in numeric report")
          report = json.loads(data)
          aoi_text = Path("test-results/aoi-compaction-gguf-results.json").read_text(encoding="utf-8")
          for bad in ("Ignore the TARGET_ID", "role: system", "Old public Aoi record:",
                      "statement=", "Preserve earlier user constraints"):
              if bad in aoi_text:
                  raise SystemExit("Aoi prompt/tool text unexpectedly present in report")
          aoi = json.loads(aoi_text)
          all_text = Path("test-results/aoi-full-compaction-gguf-results.json").read_text(encoding="utf-8")
          if any(bad in all_text for bad in ("Ignore the TARGET_ID", "role: system",
                                              "Old public Aoi record:", "statement=")):
              raise SystemExit("full Aoi report included raw fixture text")
          all_aoi = json.loads(all_text)
          if all_aoi["schema"] != "aoi-compaction-gguf/1":
              raise SystemExit("invalid full Aoi benchmark schema")
          full = all_aoi["aggregate"]
          if (all_aoi["scope"], all_aoi["distinct_question_ids"],
                  full["paired_samples"], full["compacted_samples"],
                  full["declined_samples"]) != ("all", 114, 114, 112, 2):
              raise SystemExit("full 114-proposition live comparisons are incomplete")
          if aoi["schema"] != "aoi-compaction-gguf/1":
              raise SystemExit("invalid Aoi evaluation schema")
          if aoi["aoi_published_registered_count"] != 114:
              raise SystemExit("Aoi registered evidence was not verified")
          aoi_aggregate = aoi["aggregate"]
          if (aoi_aggregate["paired_samples"], aoi_aggregate["compacted_samples"],
                  aoi_aggregate["declined_samples"]) != (24, 20, 4):
              raise SystemExit("Aoi paired live observations missing")
          if report["schema"] != "compaction-gguf-benchmark/1":
              raise SystemExit("Invalid report schema")
          a = report["aggregate"]
          if a["paired_samples"] != 8 or a["compacted_samples"] != 6 or a["declined_samples"] != 2:
              raise SystemExit("Expected real inference samples missing")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("### llama.cpp + actual GGUF compaction benchmark\n\n")
              output.write("Real, pinned SmolLM2-135M-Instruct Q4_K_M; 2048 ctx; CPU=2; paired trials=2.\n\n")
              for key in ("paired_samples", "compacted_samples", "declined_samples",
                          "original_prompt_tokens_compactable", "reduced_prompt_tokens_compactable",
                          "saved_prompt_tokens_compactable", "token_reduction_fraction_compactable",
                          "quality_exact_original", "quality_exact_reduced",
                          "median_latency_ms_original", "median_latency_ms_reduced",
                          "phantom_tool_mentions_original", "phantom_tool_mentions_reduced"):
                  output.write(f"- {key}: {a[key]}\n")
              output.write("\n### Aoi pinned research verdict QA\n\n")
              output.write("Pinned Aoi commit 7084f4bd; 114 historically adjudicated propositions, "
                           "12 selected questions × 2 paired trials; no independent re-validation.\n\n")
              for key in ("paired_samples", "compacted_samples", "declined_samples",
                          "original_prompt_tokens_compactable", "reduced_prompt_tokens_compactable",
                          "token_reduction_fraction_compactable", "quality_exact_original",
                          "quality_exact_reduced", "median_latency_ms_original",
                          "median_latency_ms_reduced", "attack_case_count"):
                  output.write(f"- {key}: {aoi_aggregate[key]}\n")
              output.write("\n### Aoi entire registered corpus (114 distinct propositions)\n\n")
              output.write("One comparison per proposition, not held-out 2026 confirmation.\n\n")
              for key in ("paired_samples", "compacted_samples", "declined_samples",
                          "token_reduction_fraction_compactable", "quality_exact_original",
                          "quality_exact_reduced", "quality_improvements",
                          "quality_regressions", "majority_class_baseline_fraction",
                          "median_latency_ms_original", "median_latency_ms_reduced"):
                  output.write(f"- {key}: {full[key]}\n")
              output.write(f"- class_accuracies: {json.dumps(full['class_accuracies'], sort_keys=True)}\n")
              output.write("\nNo real MCP tool selection or independent forward holdout was measured.\n")
          PY

      - name: Upload synthetic model evaluation and JUnit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compaction-gguf-evidence
          path: |
            test-results/compaction-gguf-results.json
            test-results/aoi-compaction-gguf-results.json
            test-results/aoi-full-compaction-gguf-results.json
            test-results/compaction-gguf-pytest.xml
            docker/stub-pages/models/model.gguf.provenance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Shut down GGUF
        if: always()
        run: docker rm -f compaction-gguf 2>/dev/null || true
