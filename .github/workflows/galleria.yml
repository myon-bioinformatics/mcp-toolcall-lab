name: Galleria optional UI

on:
  pull_request:
    paths:
      - '.github/workflows/galleria.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/mcp_toolcall_lab/gradio_galleria.py'
      - 'src/mcp_toolcall_lab/markdown_lib.py'
      - 'tests/test_gradio_galleria.py'
      - 'tests/test_streamable_http_protocol.py'
      - 'vendor/**'
      - 'vendor.lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/galleria.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/mcp_toolcall_lab/gradio_galleria.py'
      - 'src/mcp_toolcall_lab/markdown_lib.py'
      - 'tests/test_gradio_galleria.py'
      - 'tests/test_streamable_http_protocol.py'
      - 'vendor/**'
      - 'vendor.lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galleria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: '3.12.15'
      - name: Sync locked test and galleria dependencies
        run: uv sync --locked --extra test --extra galleria
      - name: Check lockfile matches pyproject (overrides may fail uv pip check)
        run: uv lock --check
      - name: Require the actual Gradio dependency
        run: uv run --locked --extra test --extra galleria python -c "import gradio, fastmcp; print(gradio.__version__, fastmcp.__version__)"
      - name: Test callbacks, UI construction and HTTP responses
        run: uv run --locked --extra test --extra galleria python -m pytest -q tests/test_gradio_galleria.py tests/test_streamable_http_protocol.py --junitxml=build/test-results/galleria.xml
      - name: Preserve Galleria JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galleria-junit
          path: build/test-results/galleria.xml
          if-no-files-found: error
