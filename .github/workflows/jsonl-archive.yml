name: JSONL archive portability

on:
  pull_request:
    paths:
      - src/mcp_toolcall_lab/jsonl_log_archive.py
      - tests/test_jsonl_log_archive.py
      - tests/fixtures/jsonl_log_archive_sample.jsonl
      - .github/workflows/jsonl-archive.yml
  push:
    branches: [main]
    paths:
      - src/mcp_toolcall_lab/jsonl_log_archive.py
      - tests/test_jsonl_log_archive.py
      - tests/fixtures/jsonl_log_archive_sample.jsonl
      - .github/workflows/jsonl-archive.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12.15', '3.13.17', '3.14.9']
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          cache-python: true
      - run: node --version
      - name: Standalone standard-library CLI import
        run: python -S src/mcp_toolcall_lab/jsonl_log_archive.py --help
      - name: Exact results and decompression bounds (locked uv test group)
        run: uv run --locked --extra test pytest -q tests/test_jsonl_log_archive.py
