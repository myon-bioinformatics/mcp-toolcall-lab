name: librechat-docker-smoke

# Real LibreChat + MCP mock + OpenAI mock on one Docker network, then Playwright.
# Default `test` workflow stays `pytest -q` only (this module skips without
# LIBRECHAT_BASE_URL). The MCP-classification test records anti-patterns
# instead of failing the job when tools/call does not happen.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Chat text to type before Send"
        required: false
        default: "Find municipalities named Exampleville"
  pull_request:
  push:
    branches: [main]
    paths:
      - "docker/runtime-requirements.txt"
      - "docker/build-requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "docker/librechat-smoke/**"
      - "demos/openai_toolcall_mock.py"
      - "librechat_mcp_mock.py"
      - "openwebui_mcp_mock.py"
      - "src/mcp_toolcall_lab/**"
      - "tests/real_chat_ui/**"
      - ".github/workflows/librechat-docker-smoke.yml"

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      force_heavy_paths: |-
        fixtures
        vendor
        system_prompts

  librechat-smoke:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.12.15"
          enable-cache: false
      - name: Install test + Playwright
        run: uv run --locked --extra test --extra browser-test playwright install --with-deps --only-shell chromium

      - name: Start the lab network (LibreChat + both mocks)
        run: |
          mkdir -p test-results
          docker compose -f docker/librechat-smoke/docker-compose.yml up --build -d

      - name: Wait for LibreChat
        run: |
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:3080 > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3080 > /dev/null

      - name: Playwright — input, Send, classify MCP
        env:
          LIBRECHAT_BASE_URL: http://127.0.0.1:3080
          MCP_TOOLCALL_LOG: ${{ github.workspace }}/test-results/mcp-toolcalls.jsonl
          OPENAI_MOCK_LOG: ${{ github.workspace }}/test-results/openai-mock.jsonl
          ANTIPATTERN_LOG: ${{ github.workspace }}/test-results/antipatterns.jsonl
          LIBRECHAT_CHAT_MESSAGE: ${{ github.event.inputs.message || 'Find municipalities named Exampleville' }}
        run: uv run --locked --extra test --extra browser-test pytest -q tests/real_chat_ui/test_librechat_docker.py -v

      - name: Capture Docker logs (time, level, content)
        if: always()
        run: |
          uv run --locked --extra test --extra browser-test python -m mcp_toolcall_lab.docker_logs capture \
            --compose docker/librechat-smoke/docker-compose.yml \
            --out test-results/docker-logs
          uv run --locked --extra test --extra browser-test python -m mcp_toolcall_lab.docker_logs timeline \
            --dir test-results \
            --out test-results/timeline.jsonl

      - name: Dump logs on failure
        if: failure()
        working-directory: docker/librechat-smoke
        run: |
          echo "::group::compose ps"
          docker compose ps -a || true
          echo "::endgroup::"
          echo "::group::mcp-mock"
          docker compose logs --no-color mcp-mock || true
          echo "::endgroup::"
          echo "::group::openai-mock"
          docker compose logs --no-color openai-mock || true
          echo "::endgroup::"
          echo "::group::librechat"
          docker compose logs --no-color librechat || true
          echo "::endgroup::"

      - name: Upload observations and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librechat-smoke-observations
          path: |
            test-results/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: docker/librechat-smoke
        run: docker compose down -v
