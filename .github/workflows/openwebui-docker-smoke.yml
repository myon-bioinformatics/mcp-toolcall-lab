name: openwebui-docker-smoke

# Real Open WebUI + MCP mock + OpenAI mock on one Docker network, then Playwright.
# MCP: openwebui_mcp_mock.py. OpenAI: demos/openai_toolcall_mock.py.
# Default `test` workflow stays `pytest -q` only (this module skips without
# OPEN_WEBUI_BASE_URL). Docker/Playwright live on this dedicated lane.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Chat text to type before Send"
        required: false
        default: "Find municipalities named Yokohama"
  pull_request:
    paths:
      - "docker/openwebui-smoke/**"
      - "docker/librechat-smoke/Dockerfile.openai"
      - "openwebui_mcp_mock.py"
      - "demos/openai_toolcall_mock.py"
      - "src/mcp_toolcall_lab/chat_ui.py"
      - "src/mcp_toolcall_lab/frontends.py"
      - "src/mcp_toolcall_lab/mcp_http.py"
      - "src/mcp_toolcall_lab/server.py"
      - "src/mcp_toolcall_lab/record.py"
      - "src/mcp_toolcall_lab/mock/**"
      - "src/mcp_toolcall_lab/docker_logs.py"
      - "tests/real_chat_ui/test_openwebui_docker.py"
      - "tests/real_chat_ui/openwebui_loop.py"
      - "tests/test_openwebui_example.py"
      - "tests/test_openwebui_loop.py"
      - ".github/workflows/openwebui-docker-smoke.yml"

jobs:
  openwebui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test + Playwright
        run: |
          pip install -e ".[test,browser-test]"
          playwright install --with-deps chromium

      - name: Start the lab network (Open WebUI + both mocks)
        run: |
          mkdir -p test-results
          docker compose -f docker/openwebui-smoke/docker-compose.yml up --build -d

      - name: Wait for Open WebUI
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 3
          done
          curl -sf http://127.0.0.1:3000/health > /dev/null

      - name: Record Open WebUI image digest
        if: always()
        run: |
          python -m mcp_toolcall_lab.docker_logs image \
            --compose docker/openwebui-smoke/docker-compose.yml \
            --service open-webui \
            --out test-results/openwebui-image.json

      - name: Playwright — input, Send, assert OpenAI + MCP wire loop
        env:
          OPEN_WEBUI_BASE_URL: http://127.0.0.1:3000
          MCP_TOOLCALL_LOG: ${{ github.workspace }}/test-results/mcp-toolcalls.jsonl
          OPENAI_MOCK_LOG: ${{ github.workspace }}/test-results/openai-mock.jsonl
          ANTIPATTERN_LOG: ${{ github.workspace }}/test-results/antipatterns.jsonl
          OPENWEBUI_CHAT_MESSAGE: ${{ github.event.inputs.message || 'Find municipalities named Yokohama' }}
        run: pytest tests/real_chat_ui/test_openwebui_docker.py -v

      - name: Capture Docker logs (time, level, content)
        if: always()
        run: |
          python -m mcp_toolcall_lab.docker_logs capture \
            --compose docker/openwebui-smoke/docker-compose.yml \
            --out test-results/docker-logs
          python -m mcp_toolcall_lab.docker_logs timeline \
            --dir test-results \
            --out test-results/timeline.jsonl

      - name: Dump logs on failure
        if: failure()
        working-directory: docker/openwebui-smoke
        run: |
          echo "::group::compose ps"
          docker compose ps -a || true
          echo "::endgroup::"
          echo "::group::mcp-mock"
          docker compose logs --no-color mcp-mock || true
          echo "::endgroup::"
          echo "::group::openai-mock"
          docker compose logs --no-color openai-mock || true
          echo "::endgroup::"
          echo "::group::open-webui"
          docker compose logs --no-color open-webui || true
          echo "::endgroup::"

      - name: Upload observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwebui-smoke-observations
          path: |
            test-results/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: docker/openwebui-smoke
        run: docker compose down -v
