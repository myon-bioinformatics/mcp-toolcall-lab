name: portable-pages

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/mcp_toolcall_lab/**"
      - "vendor/**"
      - "vendor.lock.json"
      - "scripts/build_portable_pages.py"
      - "scripts/fetch_tiny_cpu_gguf.py"
      - "fixtures/portable_summary/**"
      - "scripts/check_portable_browser.py"
      - "scripts/check_incremental_summary_build.py"
      - "scripts/write_portfolio_redirect.py"
      - "docker/portable-pages/**"
      - "docs/portable-execution.md"
      - "docs/build-time-summaries.md"
      - "docs/summary-corpus.md"
      - "docs/assets/mcp-toolcall-lab-logo.png"
      - "docs/assets/mcp-toolcall-lab-favicon-artwork.png"
      - "tests/test_portable_execution.py"
      - "tests/test_portable_source.py"
      - "tests/test_portable_summary*.py"
      - "tests/test_incremental_summary_build.py"
      - ".github/workflows/portable-pages.yml"
  push:
    branches: [main]
    paths:
      - "src/mcp_toolcall_lab/**"
      - "vendor/**"
      - "vendor.lock.json"
      - "scripts/build_portable_pages.py"
      - "scripts/fetch_tiny_cpu_gguf.py"
      - "fixtures/portable_summary/**"
      - "scripts/check_portable_browser.py"
      - "scripts/check_incremental_summary_build.py"
      - "scripts/write_portfolio_redirect.py"
      - "docker/portable-pages/**"
      - "docs/portable-execution.md"
      - "docs/build-time-summaries.md"
      - "docs/summary-corpus.md"
      - "docs/assets/mcp-toolcall-lab-logo.png"
      - "docs/assets/mcp-toolcall-lab-favicon-artwork.png"
      - "tests/test_portable_execution.py"
      - "tests/test_portable_source.py"
      - "tests/test_portable_summary*.py"
      - "tests/test_incremental_summary_build.py"
      - ".github/workflows/portable-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      - name: Test portable execution contract and bidirectional runtime
        env:
          PYTHONPATH: src
        run: |
          python -m pip install "pytest>=9.1.1"
          python -m pytest -q tests/test_portable_*.py tests/test_incremental_summary_build.py
      - name: Export static files from Docker build
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --file docker/portable-pages/Dockerfile --target artifact --build-arg SOURCE_SHA="$SOURCE_SHA" --build-arg BUILD_RUN="$GITHUB_RUN_ID" --build-arg BUILD_ATTEMPT="$GITHUB_RUN_ATTEMPT" --output type=local,dest=_portable_site .
          # Same local BuildKit graph: reuse the verified build, not a second inference run.
          docker build --file docker/portable-pages/Dockerfile --target summary-handoff --build-arg SOURCE_SHA="$SOURCE_SHA" --build-arg BUILD_RUN="$GITHUB_RUN_ID" --build-arg BUILD_ATTEMPT="$GITHUB_RUN_ATTEMPT" --output type=local,dest=_summary_handoff .
      - name: Verify exported runtime without the source checkout
        run: |
          cd _portable_site/execution/runtime
          PYTHONPATH=src python -S -m mcp_toolcall_lab.portable_execution < ../example-request.json > /tmp/python-receipt.json
          node src/mcp_toolcall_lab/static/portable_cli.mjs --adapter ../example-adapter.json < ../adapter-request.json > /tmp/node-receipt.json
          python - <<'PY'
          import json
          for filename in ('/tmp/python-receipt.json', '/tmp/node-receipt.json'):
              receipt = json.load(open(filename))
              assert receipt['status'] == 'ok', receipt
              assert receipt['model_inference_performed'] is False
          manifest = json.load(open('../source-summary-manifest.json'))
          assert manifest['status'] == 'generated', manifest
          selection = manifest['sources'][0]['choices'][0]['source_selection_request']
          json.dump(selection, open('/tmp/source-selection.json', 'w'))
          PY
          PYTHONPATH=src python -S -m mcp_toolcall_lab.portable_execution --summary-dir .. < /tmp/source-selection.json > /tmp/python-summary.json
          node src/mcp_toolcall_lab/static/portable_cli.mjs --summary-dir .. < /tmp/source-selection.json > /tmp/node-summary.json
          python - <<'PY'
          import json
          python = json.load(open('/tmp/python-summary.json'))
          node = json.load(open('/tmp/node-summary.json'))
          assert python == node
          assert python['status'] == 'generated', python
          assert python['model_inference_performed'] is True
          assert python['confidence'] is None
          assert python['provenance']['observation_log_verified'] is True
          PY
      - name: Exercise browser input, snapshot miss and stale-result handling
        run: |
          uv run --locked --extra browser-test playwright install --with-deps --only-shell chromium
          uv run --locked --extra browser-test python scripts/check_portable_browser.py --site _portable_site --screenshot test-results/portable-desktop.png --require-generated
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-browser-evidence
          path: test-results/portable-*.png
          if-no-files-found: warn
      - name: Preserve static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-pages-static
          path: _portable_site/
          if-no-files-found: error
      - name: Preserve reviewed-public incremental corpus handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-summary-handoff
          path: _summary_handoff/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _portable_site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy static GitHub Pages build
        id: deploy
        uses: actions/deploy-pages@v5
