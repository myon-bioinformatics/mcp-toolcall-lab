name: stub-pages

# Serverless try: Actions boots Docker (stub + MCP + CPU-class model),
# records anti-patterns as JSONL, publishes a static report to GitHub Pages.
# Default `test` workflow stays `pytest -q` (no Docker).
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Prompt to send through the stub /api/turn"
        required: false
        default: "Find municipalities named Yokohama"
      use_real_gguf:
        description: "Swap the lite cpu-llm stand-in for a real tiny GGUF (llama.cpp). Needs internet to huggingface.co."
        type: boolean
        required: false
        default: false
      cpu_llm_gguf_repo:
        description: "HF repo to auto-discover a small .gguf in (only used when use_real_gguf is true)"
        required: false
        default: "bartowski/SmolLM2-135M-Instruct-GGUF"
      cpu_llm_gguf_sha256:
        description: "Expected sha256 of the fetched .gguf. Default is the digest from Actions run 35433174462. Clear it only when bootstrapping a different file."
        required: false
        default: "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d"
  push:
    branches: [main]
    paths:
      - "docker/stub-pages/**"
      - "demos/cpu_llm_lite.py"
      - "vendor/markdown.py"
      - "vendor/markdown.provenance.json"
      - "src/mcp_toolcall_lab/stub_front.py"
      - "src/mcp_toolcall_lab/pixiv_dictionary_tool.py"
      - "src/mcp_toolcall_lab/static/pages_pixiv.js"
      - "src/mcp_toolcall_lab/markdown_lib.py"
      - "scripts/stub_pages_smoke.py"
      - "scripts/fetch_tiny_cpu_gguf.py"
      - "scripts/fetch_tiny_cpu_gguf.sh"
      - "src/mcp_toolcall_lab/antipatterns.py"
      - "fixtures/antipatterns/catalog.yaml"
      - ".github/workflows/stub-pages.yml"
  pull_request:
    paths:
      - "docker/stub-pages/**"
      - "demos/cpu_llm_lite.py"
      - "vendor/markdown.py"
      - "vendor/markdown.provenance.json"
      - "src/mcp_toolcall_lab/stub_front.py"
      - "src/mcp_toolcall_lab/pixiv_dictionary_tool.py"
      - "src/mcp_toolcall_lab/static/pages_pixiv.js"
      - "src/mcp_toolcall_lab/markdown_lib.py"
      - "scripts/stub_pages_smoke.py"
      - "scripts/fetch_tiny_cpu_gguf.py"
      - "scripts/fetch_tiny_cpu_gguf.sh"
      - "src/mcp_toolcall_lab/antipatterns.py"
      - "fixtures/antipatterns/catalog.yaml"
      - ".github/workflows/stub-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stub-pages
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch a real tiny GGUF (opt-in)
        if: github.event.inputs.use_real_gguf == 'true'
        env:
          CPU_LLM_GGUF_REPO: ${{ github.event.inputs.cpu_llm_gguf_repo }}
          CPU_LLM_GGUF_SHA256: ${{ github.event.inputs.cpu_llm_gguf_sha256 }}
        run: scripts/fetch_tiny_cpu_gguf.sh docker/stub-pages/models/model.gguf

      - name: Start stub + MCP + CPU-class model
        env:
          COMPOSE_GGUF_OVERLAY: ${{ github.event.inputs.use_real_gguf == 'true' && '-f docker/stub-pages/docker-compose.gguf.yml' || '' }}
        run: |
          mkdir -p test-results
          docker compose -f docker/stub-pages/docker-compose.yml $COMPOSE_GGUF_OVERLAY up --build -d

      - name: Wait for stub and cpu-llm
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/health >/dev/null && \
              curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/health
          curl -sf http://127.0.0.1:8080/health

      - name: Smoke turn and append anti-patterns
        env:
          STUB_BASE_URL: http://127.0.0.1:8765
          CPU_LLM_BASE_URL: http://127.0.0.1:8080
          CPU_LLM_BACKEND: ${{ github.event.inputs.use_real_gguf == 'true' && 'real-gguf' || 'lite-stub' }}
          STUB_CHAT_MESSAGE: ${{ github.event.inputs.message || 'Find municipalities named Yokohama' }}
          STUB_LAST_RUN: ${{ github.workspace }}/test-results/last-run.json
          ANTIPATTERN_LOG: ${{ github.workspace }}/test-results/antipatterns.jsonl
          MCP_TOOLCALL_LOG: ${{ github.workspace }}/test-results/mcp-toolcalls.jsonl
        run: python scripts/stub_pages_smoke.py

      - name: Capture Docker logs (time, level, content)
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python -m mcp_toolcall_lab.docker_logs capture \
            --compose docker/stub-pages/docker-compose.yml \
            --out test-results/docker-logs
          python -m mcp_toolcall_lab.docker_logs timeline \
            --dir test-results \
            --out test-results/timeline.jsonl

      - name: Build static Pages tree
        env:
          STUB_LAST_RUN: ${{ github.workspace }}/test-results/last-run.json
          PYTHONPATH: src
        run: |
          python -m mcp_toolcall_lab.stub_front pages --out _site \
            --last-run test-results/last-run.json \
            --observations test-results/antipatterns.jsonl

      - name: Capture Pages screenshots with Playwright CLI
        run: |
          python -m http.server 4173 --directory _site >test-results/pages-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          # Use Chromium for desktop and WebKit with an iPhone device profile
          # to approximate Safari. Install both explicitly at the same version.
          npx --yes playwright@1.55.0 install --with-deps chromium webkit
          npx --yes playwright@1.55.0 screenshot --browser=chromium --device="Desktop Chrome" --full-page \
            "http://127.0.0.1:4173/#pixiv" test-results/pixiv-pages-desktop.png
          # Capture WebKit diagnostics separately from the artifact contract.
          # Do not let `bash -e` abort before we can inspect what Playwright wrote.
          set +e
          npx --yes playwright@1.55.0 screenshot --browser=webkit --device="iPhone 13" --full-page \
            "http://127.0.0.1:4173/#pixiv" test-results/pixiv-pages-mobile.png \
            >test-results/pixiv-pages-webkit.log 2>&1
          WEBKIT_STATUS=$?
          set -e
          cat test-results/pixiv-pages-webkit.log
          echo "static WebKit exit status: $WEBKIT_STATUS"
          ls -l test-results/pixiv-pages-mobile.png || true
          test -s test-results/pixiv-pages-mobile.png

      - name: Live Pixiv fetch (stub-front -> dic.pixiv.net)
        id: pixiv_live
        run: |
          # The local /pixiv route is not a fixture: it dispatches the real
          # fetch_pixiv_dictionary_article tool, which reads dic.pixiv.net.
          # Keep the request deliberately low-rate and retry transient failures.
          # /pixiv now answers with the real fetch layer's HTTP status and
          # X-Pixiv-* headers, so a blocked/rate-limited upstream can be told
          # apart from a genuine stub or conversion failure.
          PIXIV_URL="http://127.0.0.1:8765/pixiv?title=NARUTO"
          sleep 3
          PIXIV_OK=0
          PIXIV_SKIP=0
          SKIP_REASON=""
          for i in 1 2 3; do
            echo "Pixiv live fetch attempt $i/3: $PIXIV_URL"
            CURL_STATUS=0
            HTTP_STATUS=$(curl --silent --show-error --max-time 30 \
              --dump-header test-results/pixiv-live-headers.txt \
              --output test-results/pixiv-live.html \
              --write-out '%{http_code}' "$PIXIV_URL") || CURL_STATUS=$?
            # bash -e / pipefail: a grep with no match must not abort this step,
            # it just means the response carried no X-Pixiv-* diagnostics.
            STAGE=$(grep -i '^X-Pixiv-Stage:' test-results/pixiv-live-headers.txt | tail -n1 | cut -d: -f2- | tr -d '\r ' || true)
            UPSTREAM_STATUS=$(grep -i '^X-Pixiv-Upstream-Status:' test-results/pixiv-live-headers.txt | tail -n1 | cut -d: -f2- | tr -d '\r ' || true)
            echo "curl exit status: $CURL_STATUS; HTTP status: $HTTP_STATUS; stage: ${STAGE:-none}; upstream: ${UPSTREAM_STATUS:-none}"
            echo "--- pixiv-live.html (first 120 lines) ---"
            sed -n '1,120p' test-results/pixiv-live.html || true
            echo "--- stub-front logs (tail) ---"
            docker compose -f docker/stub-pages/docker-compose.yml logs --tail=200 stub-front || true
            echo "--- pixiv request log (tail) ---"
            docker compose -f docker/stub-pages/docker-compose.yml logs --tail=200 stub-front 2>/dev/null | grep 'pixiv request' | tail -n1 || true
            if [ "$CURL_STATUS" -eq 0 ] && [ "$HTTP_STATUS" = "200" ]; then
              PIXIV_OK=1
              break
            fi
            # Only these two upstream layers are treated as an expected,
            # non-failing outcome (pixiv blocking/rate-limiting bot traffic).
            # Every other status -- 503, 404, internal errors, anything
            # unexpected -- keeps failing the job.
            if [ "$HTTP_STATUS" = "502" ] && [ "$STAGE" = "upstream_http" ] && [ "$UPSTREAM_STATUS" = "403" ]; then
              SKIP_REASON="upstream-http-403"
              PIXIV_SKIP=1
              break
            fi
            if [ "$HTTP_STATUS" = "503" ] && [ "$STAGE" = "upstream_http" ] && [ "$UPSTREAM_STATUS" = "429" ]; then
              SKIP_REASON="upstream-rate-limited-429"
              PIXIV_SKIP=1
              break
            fi
            sleep $((i * 3))
          done
          if [ "$PIXIV_SKIP" -eq 1 ]; then
            echo "::warning::live Pixiv fetch classified $SKIP_REASON at dic.pixiv.net; skipping live screenshots"
            echo "live=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PIXIV_OK" -ne 1 ]; then
            echo "live Pixiv evidence fetch failed after 3 attempts (HTTP status: $HTTP_STATUS, stage: ${STAGE:-none})" >&2
            exit 1
          fi
          if ! grep -q 'data-testid="pixiv-result"' test-results/pixiv-live.html; then
            echo "missing pixiv-result marker after successful HTTP response" >&2
            docker compose -f docker/stub-pages/docker-compose.yml logs --tail=200 stub-front || true
            exit 1
          fi
          if ! grep -q 'https://dic.pixiv.net/a/NARUTO' test-results/pixiv-live.html; then
            echo "missing expected Pixiv source URL after successful HTTP response" >&2
            docker compose -f docker/stub-pages/docker-compose.yml logs --tail=200 stub-front || true
            exit 1
          fi
          echo "live=ok" >> "$GITHUB_OUTPUT"

      - name: Capture live Pixiv screenshots
        if: steps.pixiv_live.outputs.live == 'ok'
        run: |
          PIXIV_URL="http://127.0.0.1:8765/pixiv?title=NARUTO"
          npx --yes playwright@1.55.0 screenshot --browser=chromium --device="Desktop Chrome" --full-page \
            "$PIXIV_URL" test-results/pixiv-live-desktop.png
          set +e
          npx --yes playwright@1.55.0 screenshot --browser=webkit --device="iPhone 13" --full-page \
            "$PIXIV_URL" test-results/pixiv-live-mobile.png \
            >test-results/pixiv-live-webkit.log 2>&1
          LIVE_WEBKIT_STATUS=$?
          set -e
          cat test-results/pixiv-live-webkit.log
          echo "live WebKit exit status: $LIVE_WEBKIT_STATUS"
          ls -l test-results/pixiv-live-mobile.png || true
          test -s test-results/pixiv-live-mobile.png

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-pages-observations
          path: |
            test-results/
            _site/
            docker/stub-pages/models/*.provenance.json
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Tear down
        if: always()
        env:
          COMPOSE_GGUF_OVERLAY: ${{ github.event.inputs.use_real_gguf == 'true' && '-f docker/stub-pages/docker-compose.gguf.yml' || '' }}
        run: docker compose -f docker/stub-pages/docker-compose.yml $COMPOSE_GGUF_OVERLAY down -v

  deploy:
    needs: smoke
    # Pages is the merged main report only. Feature-branch
    # workflow_dispatch (including use_real_gguf=true) must not
    # enter the github-pages environment — that job fails with no
    # steps when the environment is restricted to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
