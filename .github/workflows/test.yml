name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      force_heavy_paths: |-
        fixtures
        vendor
        system_prompts

  vendor-locked:
    name: Vendor locked baseline
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.12.15"
          activate-environment: true
          enable-cache: false
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify and recreate locked vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              Path(entry["destination"]).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  test:
    permissions:
      contents: read
    needs: [changes, vendor-locked]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Retain the minimum-supported Python/Node lanes, plus one latest pair.
        # Three rows avoid the redundant Python 3.15 / Node 24 cross-product.
        include:
          - python-version: "3.12.15"
            node-version: "24.22.1"
          - python-version: "3.12.15"
            node-version: "26.12.1"
          - python-version: "3.15"
            node-version: "26.12.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: false
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Deno check
        run: deno check deploy/wikipedia-mcp/main.ts
      - name: Deno test
        run: deno test --allow-env --allow-read deploy/wikipedia-mcp
      - name: Test
        run: uv run --locked --extra test pytest -q --junitxml=reports/pytest.xml
      - name: Preserve raw Python JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-${{ matrix.python-version }}-node-${{ matrix.node-version }}
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 14

  junit-identity:
    needs: [changes, test]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact-pattern: junit-python-*-node-*
      expected-reports: '["junit-python-3.12.15-node-24.22.1/pytest.xml", "junit-python-3.12.15-node-26.12.1/pytest.xml", "junit-python-3.15-node-26.12.1/pytest.xml"]'
      output-artifact: python-failure-identity

  public-resolver-compat:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: false
      - name: Compile, import, and execute vendorable public resolver
        run: |
          python -m py_compile src/mcp_toolcall_lab/github_public_resolver.py
          python - <<'PY'
          import importlib.util
          from io import BytesIO
          from pathlib import Path
          from urllib.error import HTTPError

          path = Path("src/mcp_toolcall_lab/github_public_resolver.py")
          spec = importlib.util.spec_from_file_location("github_public_resolver_compat", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class Response(BytesIO):
              def __init__(self, url):
                  super().__init__(b"")
                  self.status = 200
                  self._url = url
                  self.headers = {}
              def getcode(self):
                  return self.status
              def geturl(self):
                  return self._url

          def ok_opener(request, timeout):
              return Response(request.full_url)

          success = module.probe_url("https://example.test/x", opener=ok_opener)
          assert success["status"] == "reachable"
          assert success["checked_at"].endswith("+00:00")

          def error_opener(request, timeout):
              raise HTTPError(request.full_url, 404, "missing", {}, None)

          missing = module.probe_url("https://example.test/missing", opener=error_opener)
          assert missing["status"] == "not_found"
          assert missing["resolved_url"] == "https://example.test/missing"
          print(success["checked_at"], missing["status"])
          PY
