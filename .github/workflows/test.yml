name: test

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      vendor-mode:
        description: Public vendor placement mode for this CI run
        type: choice
        options: [update, locked]
        default: update

jobs:
  resolve-vendor:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 37f30d5acdc1906d4acbd103ce6f652bc13ca7eb
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Save checked-in vendor identities
        run: cp vendor.lock.json .vendor-baseline.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
              Path(entry['destination']).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Update public vendor files for this run
        id: vendor-update
        shell: bash
        if: inputs.vendor-mode != 'locked'
        run: |
          python -S .vendor-sync-tools/vendor_sync.py update --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Refresh legacy provenance from the verified lock
        run: python -S scripts/sync_vendor_provenance.py
      - name: Summarize snapshot and checked-in baseline
        if: always()
        shell: bash
        env:
          VENDOR_UPDATE_OUTCOME: ${{ steps.vendor-update.outcome }}
        run: >-
          python -S scripts/sync_vendor_provenance.py
          --summary-baseline .vendor-baseline.lock.json
          --summary-output "$GITHUB_STEP_SUMMARY"
          --update-outcome "$VENDOR_UPDATE_OUTCOME"
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: |
            vendor.lock.json
            vendor/gh_identity.py
            vendor/gh_identity-LICENSE
            vendor/myon-bioinformatics-LICENSE
            vendor/ascii_artist.py
            vendor/gh_ops.py
            vendor/git_inspector.py
            vendor/markdown.py
            vendor/python_artifact_provenance.py
            vendor/repository_metadata_contract.py
            vendor/repository_metadata_generator.py
            vendor/ascii_artist-LICENSE
            vendor/browser-test-kit-LICENSE
            vendor/markdown-LICENSE
            vendor/Ironmate-LICENSE
            vendor/ascii_artist.provenance.json
            vendor/gh_ops.provenance.json
            vendor/git_inspector.provenance.json
            vendor/markdown.provenance.json
            vendor/python_artifact_provenance.provenance.json
            vendor/repository_metadata_contract.provenance.json
            vendor/repository_metadata_generator.provenance.json
          if-no-files-found: error
          retention-days: 14

  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@76a9e43fe7469d0e3a5728e0521bc5738afad725
    with:
      force_heavy_paths: |-
        fixtures
        vendor
        system_prompts

  test:
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 37f30d5acdc1906d4acbd103ce6f652bc13ca7eb
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        shell: bash
        run: |
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S scripts/sync_vendor_provenance.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: pip install -e ".[test]"
      - name: Deno check
        run: deno check deploy/wikipedia-mcp/main.ts
      - name: Deno test
        run: deno test --allow-env --allow-read deploy/wikipedia-mcp
      - name: Test
        run: pytest -q --junitxml=reports/pytest.xml
      - name: Preserve raw Python JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-3.11
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 14


      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-py3.11
          path: |
            vendor.lock.json
            vendor/gh_identity.py
            vendor/gh_identity-LICENSE
            vendor/myon-bioinformatics-LICENSE
            vendor/ascii_artist.py
            vendor/gh_ops.py
            vendor/git_inspector.py
            vendor/markdown.py
            vendor/python_artifact_provenance.py
            vendor/repository_metadata_contract.py
            vendor/repository_metadata_generator.py
            vendor/ascii_artist-LICENSE
            vendor/browser-test-kit-LICENSE
            vendor/markdown-LICENSE
            vendor/Ironmate-LICENSE
            vendor/ascii_artist.provenance.json
            vendor/gh_ops.provenance.json
            vendor/git_inspector.provenance.json
            vendor/markdown.provenance.json
            vendor/python_artifact_provenance.provenance.json
            vendor/repository_metadata_contract.provenance.json
            vendor/repository_metadata_generator.provenance.json
          if-no-files-found: error
          retention-days: 14

  junit-identity:
    needs: [changes, test]
    if: always() && needs.changes.outputs.non_docs_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      artifact-pattern: junit-python-3.11
      expected-reports: '["junit-python-3.11/pytest.xml"]'
      output-artifact: python-failure-identity

  public-resolver-compat:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile, import, and execute vendorable public resolver
        run: |
          python -m py_compile src/mcp_toolcall_lab/github_public_resolver.py
          python - <<'PY'
          import importlib.util
          from io import BytesIO
          from pathlib import Path
          from urllib.error import HTTPError

          path = Path("src/mcp_toolcall_lab/github_public_resolver.py")
          spec = importlib.util.spec_from_file_location("github_public_resolver_compat", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class Response(BytesIO):
              def __init__(self, url):
                  super().__init__(b"")
                  self.status = 200
                  self._url = url
                  self.headers = {}
              def getcode(self):
                  return self.status
              def geturl(self):
                  return self._url

          def ok_opener(request, timeout):
              return Response(request.full_url)

          success = module.probe_url("https://example.test/x", opener=ok_opener)
          assert success["status"] == "reachable"
          assert success["checked_at"].endswith("+00:00")

          def error_opener(request, timeout):
              raise HTTPError(request.full_url, 404, "missing", {}, None)

          missing = module.probe_url("https://example.test/missing", opener=error_opener)
          assert missing["status"] == "not_found"
          assert missing["resolved_url"] == "https://example.test/missing"
          print(success["checked_at"], missing["status"])
          PY

  test-locked:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@v7
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        ref: 37f30d5acdc1906d4acbd103ce6f652bc13ca7eb
        path: .vendor-sync-tools
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Refresh legacy provenance from the verified lock
      run: python -S scripts/sync_vendor_provenance.py
    - name: Install
      run: pip install -e ".[test]"
    - name: Test
      run: pytest -q
    - name: Preserve vendor lock used by this run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-vendor-lock-py3.11
        path: |
          vendor.lock.json
          vendor/gh_identity.py
          vendor/gh_identity-LICENSE
          vendor/myon-bioinformatics-LICENSE
          vendor/ascii_artist.py
          vendor/gh_ops.py
          vendor/git_inspector.py
          vendor/markdown.py
          vendor/python_artifact_provenance.py
          vendor/repository_metadata_contract.py
          vendor/repository_metadata_generator.py
          vendor/ascii_artist-LICENSE
          vendor/browser-test-kit-LICENSE
          vendor/markdown-LICENSE
          vendor/Ironmate-LICENSE
          vendor/ascii_artist.provenance.json
          vendor/gh_ops.provenance.json
          vendor/git_inspector.provenance.json
          vendor/markdown.provenance.json
          vendor/python_artifact_provenance.provenance.json
          vendor/repository_metadata_contract.provenance.json
          vendor/repository_metadata_generator.provenance.json
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20
