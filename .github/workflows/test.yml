name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: pip install -e ".[test]"
      - name: Deno check
        run: deno check deploy/wikipedia-mcp/main.ts
      - name: Deno test
        run: deno test --allow-env --allow-read deploy/wikipedia-mcp
      - name: Test
        run: pytest -q
