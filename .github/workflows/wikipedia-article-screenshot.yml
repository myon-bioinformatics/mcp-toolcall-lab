name: wikipedia-article-screenshot

# Stdlib stub /wiki screenshots via `python -m playwright screenshot`.
# Default pytest (`test` workflow, `uv run --locked` then `pytest -q`) does not run this.
# Deterministic CI uses fixtures/wikipedia/exampleville_extract.json.
# Live Wikipedia is workflow_dispatch --live only (or a local --live run).
on:
  workflow_dispatch:
    inputs:
      live_wikipedia:
        description: "Fetch live Wikipedia instead of the pinned fixture (off by default)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/mcp_toolcall_lab/wikipedia_tool.py"
      - "src/mcp_toolcall_lab/stub_front.py"
      - "src/mcp_toolcall_lab/catalog.py"
      - "src/mcp_toolcall_lab/server.py"
      - "scripts/wikipedia_article_screenshot.py"
      - "fixtures/wikipedia/**"
      - "docs/wikipedia_tool.md"
      - ".github/workflows/wikipedia-article-screenshot.yml"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      - name: Install stub + Playwright CLI
        run: uv run --locked --extra test --extra browser-test playwright install --with-deps --only-shell chromium
      - name: Screenshot title-entered and heading-selected (fixture)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.live_wikipedia != true }}
        env:
          MCP_TOOLCALL_LAB_WIKIPEDIA_FIXTURE: ${{ github.workspace }}/fixtures/wikipedia/exampleville_extract.json
        run: uv run --locked --extra test --extra browser-test python scripts/wikipedia_article_screenshot.py --out test-results/wiki-screenshots
      - name: Screenshot title-entered and heading-selected (live Wikipedia)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_wikipedia == true }}
        env:
          MCP_TOOLCALL_LAB_LIVE_WIKIPEDIA: "1"
        run: uv run --locked --extra test --extra browser-test python scripts/wikipedia_article_screenshot.py --live --out test-results/wiki-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wikipedia-article-screenshots
          path: test-results/wiki-screenshots/
          if-no-files-found: error
