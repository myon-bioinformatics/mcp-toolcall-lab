# Minimal LibreChat config for the lab smoke: one custom OpenAI-compatible
# endpoint (demos/openai_toolcall_mock.py) and this repo's Streamable HTTP MCP
# mock. Merge nothing else — this file is only for docker/librechat-smoke.
#
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/mcp_servers
version: 1.3.16
cache: true

interface:
  customWelcome: "mcp-toolcall-lab LibreChat smoke"
  mcpServers:
    placeholder: "MCP"

# Both mocks listen on the CI/host network. LibreChat in Docker reaches them
# via host.docker.internal (see docker-compose extra_hosts). Bind those
# processes with HOST=0.0.0.0 / MCP_HOST=0.0.0.0 — 127.0.0.1 is not visible
# from the container on Linux.
mcpServers:
  lab:
    type: streamable-http
    url: http://host.docker.internal:8000/mcp
    requiresOAuth: false
    startup: true
    timeout: 60000
    serverInstructions: true
    chatMenu: true

endpoints:
  custom:
    - name: "Lab Mock"
      apiKey: "sk-mcp-toolcall-lab"
      baseURL: "http://host.docker.internal:8090/v1"
      models:
        default:
          - "lab-model"
        fetch: false
      titleConvo: false
      titleModel: "lab-model"
      modelDisplayLabel: "lab-model"
      dropParams:
        - "stop"
        - "user"
        - "frequency_penalty"
        - "presence_penalty"
