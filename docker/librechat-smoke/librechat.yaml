# Minimal LibreChat config for the lab smoke: one custom OpenAI-compatible
# endpoint and this repo's Streamable HTTP MCP mock, both on the compose
# network `mcp-toolcall-lab` (compose service DNS, not the host gateway).
#
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/mcp_servers
version: 1.3.16
cache: true

interface:
  customWelcome: "mcp-toolcall-lab LibreChat smoke"
  mcpServers:
    placeholder: "MCP"

mcpServers:
  lab:
    type: streamable-http
    url: http://mcp-mock:8000/mcp
    requiresOAuth: false
    startup: true
    timeout: 60000
    serverInstructions: true
    chatMenu: true

endpoints:
  custom:
    - name: "Lab Mock"
      apiKey: "sk-mcp-toolcall-lab"
      baseURL: "http://openai-mock:8090/v1"
      models:
        default:
          - "lab-model"
        fetch: false
      titleConvo: false
      titleModel: "lab-model"
      modelDisplayLabel: "lab-model"
      dropParams:
        - "stop"
        - "user"
        - "frequency_penalty"
        - "presence_penalty"
