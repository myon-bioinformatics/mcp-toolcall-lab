# Real tiny GGUF behind the same service DNS ``cpu-llm``, in place of
# demos/cpu_llm_lite.py. Opt-in only (needs internet to huggingface.co,
# which this repo's own dev sandbox cannot reach — see
# scripts/fetch_tiny_cpu_gguf.py's module docstring): CI wires this in via
# stub-pages.yml's `use_real_gguf` workflow_dispatch input, never on a
# plain push, so the always-on smoke job never depends on that reachability.
#
# The image tag below (`:server`) floats with upstream's latest server
# build — accuracy/reproducibility of the *model* does not matter here
# (see catalog note), but if the *image* itself ever needs pinning, list
# tags at https://github.com/ggml-org/llama.cpp/pkgs/container/llama.cpp
# and swap in a dated one.
#
#   scripts/fetch_tiny_cpu_gguf.sh docker/stub-pages/models/model.gguf
#   docker compose -f docker/stub-pages/docker-compose.yml \
#     -f docker/stub-pages/docker-compose.gguf.yml up --build
services:
  cpu-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/model.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
    volumes:
      - ./models:/models
    environment: {}
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
