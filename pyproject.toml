[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolcall-lab"
version = "0.1.0"
description = "FastMCP mock tools for reproducible tool-calling experiments"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
]

[project.scripts]
mcp-chat-ui = "mcp_toolcall_lab.chat_ui:main"
mcp-frontends = "mcp_toolcall_lab.frontends:main"
mcp-trace-probe = "mcp_toolcall_lab.trace_probe:main"
mcp-stub-front = "mcp_toolcall_lab.stub_front:main"
mcp-docker-logs = "mcp_toolcall_lab.docker_logs:main"

[project.optional-dependencies]
galleria = [
    "fastapi>=0.147.0",
    "gradio>=6.30.0",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "PyYAML>=6.0.3",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]
# Optional: real-browser fetch() coverage of the HTTP API (tests/test_browser_fetch_protocol.py).
# Not part of `test`. CI installs it only for browser lanes. Those tests
# pytest.importorskip when playwright isn't installed. Needs `playwright install chromium` too.
browser-test = ["playwright>=1.64.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolcall_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Use `streamable_http_client` instead.:DeprecationWarning",
]
markers = [
    "integration: starts a local Streamable HTTP MCP server",
    "real_chat_ui: needs LibreChat or Open WebUI Docker + Playwright (skipped unless LIBRECHAT_BASE_URL or OPEN_WEBUI_BASE_URL is set)",
]

[tool.uv]
override-dependencies = ["pillow>=13.0.0"]
